<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MODA — Try it on, live</title>
<meta name="description" content="Preview any outfit on a real model before you buy. Switch the scene, lighting, clothing and cast instantly, then order the exact look you see.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --retake-ease: cubic-bezier(0.22, 1, 0.36, 1);
    --retake-slow-ease: cubic-bezier(0.65, 0, 0.35, 1);
  }
  *,*::before,*::after{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }
  body{
    font-family:'Manrope', system-ui, sans-serif;
    background:#000;
    color:#fff;
    -webkit-font-smoothing:antialiased;
    -moz-osx-font-smoothing:grayscale;
    overflow-x:hidden;
  }
  ::selection{ background:rgba(255,255,255,0.2); }
  :focus-visible{ outline:2px solid #fff; outline-offset:3px; }
  button{ font-family:'Manrope', system-ui, sans-serif; }

  .visually-hidden{
    position:absolute; width:1px; height:1px; padding:0; margin:-1px;
    overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0;
  }

  .stage{
    position:relative; isolation:isolate;
    width:100%; height:100vh; height:100dvh;
    overflow:hidden; background:#000;
  }

  .media{
    position:absolute; inset:0; width:100%; height:100%;
    object-fit:cover; object-position:center;
    z-index:0; pointer-events:none;
    visibility:hidden;
  }
  .media.is-visible{ visibility:visible; }

  .hero{ position:absolute; inset:0; z-index:10; pointer-events:none; }

  .hero h1{
    position:absolute;
    top:35.9%; left:50%; transform:translateX(-50%);
    width:min(901px, calc(100vw - 48px));
    font-size:clamp(62px,6.8vw,100px);
    font-weight:500; line-height:0.8; letter-spacing:-0.04em;
    white-space:nowrap; margin:0;
    text-shadow:0 2px 12px rgb(0 0 0 / 0.14);
  }
  .hero h1 span{
    display:inline-block;
    transition: opacity 900ms var(--retake-ease), filter 900ms var(--retake-ease), transform 900ms var(--retake-ease);
  }
  .hero h1 span:nth-child(1){ transition-delay:0ms; }
  .hero h1 span:nth-child(2){ transition-delay:90ms; }
  .hero h1 span:nth-child(3){ transition-delay:180ms; }
  .stage.title-hidden .hero h1 span{
    opacity:0; filter:blur(12px); transform:translateY(-10px);
  }

  .hero p{
    position:absolute;
    top:calc(46.78% + 94px); left:50%; transform:translateX(-50%);
    width:min(734px, calc(100vw - 48px));
    font-size:clamp(14px,1.25vw,18px);
    font-weight:400; line-height:1.2; letter-spacing:-0.04em;
    margin:0;
    text-shadow:0 1px 8px rgb(0 0 0 / 0.16);
  }

  /* ---------- controller ---------- */
  .controller{
    position:absolute; top:46.78%; left:50%; transform:translateX(-50%);
    width:min(880px, calc(100vw - 48px)); height:72px; z-index:20;
  }

  .glass{ position:absolute; border-radius:999px; }
  .glass::before, .glass::after{ content:""; position:absolute; inset:0; border-radius:inherit; pointer-events:none; }
  .glass::before{
    background:
      radial-gradient(120% 150% at var(--glass-x,24%) var(--glass-y,8%), rgb(255 255 255 / 0.25), rgb(255 255 255 / 0) 53%),
      linear-gradient(115deg, rgb(255 255 255 / 0.10), rgb(255 255 255 / 0) 42%);
  }
  .glass::after{
    padding:1px;
    background: conic-gradient(from 225deg, #7fe3ff, rgb(255 255 255 / 0.35), #ffffff, #ffd7e6, rgb(255 255 255 / 0.35), #7fe3ff);
    -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
            mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    -webkit-mask-composite: xor;
            mask-composite: exclude;
  }

  .track{
    top:4px; left:0; width:100%; height:64px;
    background: rgb(24 55 82 / 0.31);
    border: 1px solid rgb(255 255 255 / 0.2);
    backdrop-filter: blur(9px) saturate(126%) contrast(108%) brightness(103%);
    -webkit-backdrop-filter: blur(9px) saturate(126%) contrast(108%) brightness(103%);
    box-shadow:
      0 14px 38px rgb(4 24 43 / 0.16),
      0 2px 7px rgb(4 24 43 / 0.1),
      inset 1px 1px 0 rgb(255 255 255 / 0.48),
      inset -1px -1px 0 rgb(21 49 73 / 0.14),
      inset 0 0 0 0.5px rgb(255 255 255 / 0.16);
    opacity:1;
  }
  .track::after{ opacity:0.27; }

  .capsule{
    top:-1px; height:72px;
    left: var(--cap-left, -5px);
    width: var(--cap-width, calc(20% + 5px));
    background: rgb(246 251 255 / 0.24);
    border: 1px solid rgb(255 255 255 / 0.28);
    backdrop-filter: blur(13px) saturate(128%) contrast(107%) brightness(105%);
    -webkit-backdrop-filter: blur(13px) saturate(128%) contrast(107%) brightness(105%);
    box-shadow:
      0 11px 28px rgb(4 24 43 / 0.17),
      0 2px 6px rgb(4 24 43 / 0.1),
      inset 1px 1px 0 rgb(255 255 255 / 0.62),
      inset -1px -1px 0 rgb(20 49 73 / 0.18),
      inset 0 0 12px rgb(255 255 255 / 0.055);
    transition: left 620ms var(--retake-ease), width 620ms var(--retake-ease), background 300ms linear;
  }
  .capsule::after{ opacity:0.30; }

  .controller.collapsed .capsule{
    transition: left 980ms var(--retake-slow-ease), width 980ms var(--retake-slow-ease), background 300ms linear;
    background: rgb(246 251 255 / 0.14);
  }
  .controller.collapsed .track{
    left:calc(50% - 96px); width:192px;
    transition: left 980ms var(--retake-slow-ease), width 980ms var(--retake-slow-ease), opacity 400ms linear 650ms;
    opacity:0;
  }

  .cells{
    position:absolute; inset:0;
    display:grid; grid-template-columns:repeat(5,1fr);
    align-items:center;
  }
  .cell{
    position:relative;
    display:flex; align-items:center; justify-content:center;
    height:100%; padding:0 14px;
    font-size:23px; font-weight:400; line-height:1.2; letter-spacing:-0.04em;
    white-space:nowrap; color:#fff;
    transition: opacity 420ms var(--retake-ease), filter 420ms var(--retake-ease), transform 980ms var(--retake-slow-ease);
  }
  button.cell{
    background:transparent; border:0; border-radius:999px; cursor:pointer;
    -webkit-tap-highlight-color: transparent;
  }
  button.cell:disabled{ cursor:default; }
  .cell.label{ opacity:1; transition: opacity 300ms linear; }
  .controller.hover-active .cell.label{ opacity:0.5; }

  .cell.dim{ opacity:0; filter:blur(10px); transform:scale(0.94); pointer-events:none; }

  .cell.is-reset{
    text-decoration:underline; text-underline-offset:3px; text-decoration-thickness:1px;
    animation: resetReveal 520ms var(--retake-ease) forwards;
  }
  @keyframes resetReveal{
    from{ opacity:0; filter:blur(10px); }
    to{ opacity:1; filter:blur(0); }
  }
  .cell.reset-exit{
    opacity:0; filter:blur(10px);
    transition: opacity 980ms var(--retake-ease), filter 980ms var(--retake-ease);
  }

  /* ---------- header ---------- */
  header{
    position:absolute; top:0; left:0; width:100%; z-index:30;
    display:grid; grid-template-columns:auto 1fr auto; align-items:center;
    padding: calc(58px + env(safe-area-inset-top)) 40px 40px;
    text-shadow:0 1px 6px rgb(0 0 0 / 0.18);
  }
  .logo-link{ display:inline-flex; align-items:center; }
  .logo-link svg{ height:24px; width:auto; display:block; }
  .meta{
    display:flex; align-items:center;
    margin-left:clamp(48px,5vw,70px); gap:clamp(28px,3vw,44px);
    font-size:18px; line-height:1.2; letter-spacing:-0.04em;
  }
  .try-now{
    justify-self:end; position:relative;
    display:inline-flex; align-items:center; justify-content:center;
    width:152px; height:38px; border-radius:999px;
    border:1px solid rgb(255 255 255 / 0.75); background:transparent;
    color:#fff; text-decoration:none; font-size:18px;
    transition: color 300ms, background 300ms, border-color 300ms;
  }
  .try-now:hover, .try-now:focus-visible{ background:#fff; color:#0b1a26; }

  /* ---------- status / notice ---------- */
  .notice{
    position:absolute; z-index:40; left:50%; bottom:28px; transform:translateX(-50%);
    display:flex; align-items:center; gap:12px;
    background:rgba(0,0,0,0.62); padding:10px 18px; border-radius:999px;
    font-size:14px; letter-spacing:-0.01em;
  }
  .notice[hidden]{ display:none; }
  .notice button{
    background:#fff; color:#0b1a26; border:0; border-radius:999px;
    padding:6px 14px; cursor:pointer; font-size:13px;
  }

  /* ---------- responsive ---------- */
  @media (max-width:900px){
    header{ padding: calc(24px + env(safe-area-inset-top)) 24px 24px; }
    .meta{ font-size:14px; gap:22px; margin-left:34px; }
    .try-now{ width:116px; height:36px; font-size:14px; }
    .cell{ font-size:clamp(17px, 2.5vw, 24px); }
  }

  @media (max-width:700px){
    header{ padding-left:18px; padding-right:18px; }
    .logo-link svg{ height:21px; }
    .meta{ font-size:12px; }
    .meta .meta-secondary{ display:none; }
    .try-now{ width:92px; height:34px; font-size:13px; }
    .try-now::after{
      content:""; position:absolute; inset:-6px -10px;
    }

    .hero h1{
      top:34%; width:calc(100vw - 40px);
      font-size:clamp(48px,14vw,64px); line-height:0.88;
      white-space:normal;
    }
    .hero p{ top:77%; width:calc(100vw - 44px); font-size:14px; }

    .controller{ top:53%; width:calc(100vw - 40px); height:156px; }
    .track{ top:0; height:156px; border-radius:28px; }

    .cells{
      display:grid; grid-template-columns:1fr 1fr;
      grid-template-rows:48px 54px 54px;
      align-items:stretch;
    }
    .cell.label{ grid-column:1 / -1; }
    .cells .cell{ font-size:17px; border-top:1px solid rgb(255 255 255 / 0.12); }
    .cells .cell.label{ border-top:0; }
    .cells > .cell:nth-child(2){ border-right:1px solid rgb(255 255 255 / 0.12); }
    .cells > .cell:nth-child(4){ border-right:1px solid rgb(255 255 255 / 0.12); }

    .capsule{ opacity:0; pointer-events:none; }
    button.cell:active, button.cell:focus-visible{ outline-offset:-3px; }

    .controller.collapsed .capsule{
      opacity:1; pointer-events:auto;
      left:50%; top:4vh; top:4dvh;
      transform:translate(-50%,-50%);
      width:196px; height:64px;
      background: rgb(246 251 255 / 0.18);
    }
    .controller.collapsed .track{ opacity:0; }
  }

  @media (max-width:700px) and (max-height:700px){
    .controller{ top:50%; }
    .hero p{ top:calc(50% + 168px); width:calc(100vw - 32px); font-size:13px; }
  }

  @media (max-height:520px) and (orientation:landscape){
    .hero h1{ top:20%; font-size:clamp(34px,8vh,56px); }
    .controller{ top:50%; }
    .hero p{ top:auto; bottom:8px; font-size:13px; }
  }

  @media (max-width:700px) and (max-height:520px) and (orientation:landscape){
    .hero h1{ top:12%; font-size:clamp(28px,7vh,44px); }
    .controller{ top:46%; height:118px; }
    .track{ height:118px; }
    .cells{ grid-template-rows:36px 41px 41px; }
    .cells .cell{ font-size:15px; }
    .hero p{ bottom:6px; font-size:12px; }
  }

  @media (prefers-reduced-motion: reduce){
    .capsule, .track, .cell, .hero h1 span, .try-now{
      transition-duration:1ms !important;
      transition-delay:0s !important;
      animation-duration:1ms !important;
    }
    .cell.dim, .stage.title-hidden .hero h1 span, .cell.is-reset, .cell.reset-exit{
      filter:none !important;
    }
  }
</style>
</head>
<body>
  <div class="stage" id="stage">

    <video class="media" id="v-colorway-fwd" data-key="colorway" data-dir="forward" muted playsinline preload="auto" aria-hidden="true" src="https://pub-86dc5b5484314368ac5436a674b0d919.r2.dev/designs/video-1.mp4"></video>
    <video class="media" id="v-colorway-rev" data-key="colorway" data-dir="reverse" muted playsinline preload="auto" aria-hidden="true" src="https://pub-86dc5b5484314368ac5436a674b0d919.r2.dev/designs/video-1-reverse.mp4"></video>
    <video class="media" id="v-scene-fwd" data-key="scene" data-dir="forward" muted playsinline preload="auto" aria-hidden="true" src="https://pub-86dc5b5484314368ac5436a674b0d919.r2.dev/designs/video-2.mp4"></video>
    <video class="media" id="v-scene-rev" data-key="scene" data-dir="reverse" muted playsinline preload="auto" aria-hidden="true" src="https://pub-86dc5b5484314368ac5436a674b0d919.r2.dev/designs/video-2-reverse.mp4"></video>
    <video class="media" id="v-light-fwd" data-key="light" data-dir="forward" muted playsinline preload="auto" aria-hidden="true" src="https://pub-86dc5b5484314368ac5436a674b0d919.r2.dev/designs/video-3.mp4"></video>
    <video class="media" id="v-light-rev" data-key="light" data-dir="reverse" muted playsinline preload="auto" aria-hidden="true" src="https://pub-86dc5b5484314368ac5436a674b0d919.r2.dev/designs/video-3-reverse.mp4"></video>
    <video class="media" id="v-fullLook-fwd" data-key="fullLook" data-dir="forward" muted playsinline preload="auto" aria-hidden="true" src="https://pub-86dc5b5484314368ac5436a674b0d919.r2.dev/designs/video-4.mp4"></video>
    <video class="media" id="v-fullLook-rev" data-key="fullLook" data-dir="reverse" muted playsinline preload="auto" aria-hidden="true" src="https://pub-86dc5b5484314368ac5436a674b0d919.r2.dev/designs/video-4-reverse.mp4"></video>

    <div class="hero" id="hero">
      <h1 id="heroTitle"><span>The</span> <span>perfect</span> <span>fit</span></h1>
      <p>MODA lets you preview any outfit on a real model before you buy — switch the scene, lighting and cast instantly, then order the exact look you see.</p>
    </div>

    <div class="controller" id="controller" role="group" aria-label="Product view controller">
      <div class="track glass" id="track"></div>
      <div class="capsule glass" id="capsule"></div>
      <div class="cells" id="cells">
        <div class="cell label" id="selectLabel">Style it →</div>
        <button class="cell option" type="button" data-key="scene" disabled>Scene</button>
        <button class="cell option" type="button" data-key="light" disabled>Lighting</button>
        <button class="cell option" type="button" data-key="colorway" disabled>Clothing</button>
        <button class="cell option" type="button" data-key="fullLook" disabled>Cast</button>
      </div>
    </div>

    <header>
      <a href="#" aria-label="MODA home" class="logo-link">
        <svg viewBox="0 0 108 32" width="108" height="32" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <text x="0" y="24" font-family="Manrope, system-ui, sans-serif" font-weight="700" font-size="27" letter-spacing="-1" fill="#ffffff">MODA</text>
        </svg>
      </a>
      <div class="meta">
        <span>New drop just landed</span>
        <span class="meta-secondary">Free returns</span>
      </div>
      <a class="try-now" href="https://moda.app/" target="_blank" rel="noopener noreferrer">Shop now</a>
    </header>

    <div id="liveRegion" class="visually-hidden" aria-live="polite"></div>
    <div class="notice" id="notice" hidden>
      <span id="noticeText"></span>
      <button type="button" id="retryBtn" hidden>Retry</button>
    </div>

  </div>

<script>
(function(){
  "use strict";

  var stage = document.getElementById('stage');
  var controller = document.getElementById('controller');
  var track = document.getElementById('track');
  var capsule = document.getElementById('capsule');
  var selectLabel = document.getElementById('selectLabel');
  var liveRegion = document.getElementById('liveRegion');
  var notice = document.getElementById('notice');
  var noticeText = document.getElementById('noticeText');
  var retryBtn = document.getElementById('retryBtn');
  var heroTitle = document.getElementById('heroTitle');

  var optionButtons = Array.prototype.slice.call(document.querySelectorAll('.cell.option'));
  var allCells = [selectLabel].concat(optionButtons);
  var allMedia = Array.prototype.slice.call(document.querySelectorAll('video.media'));

  var CAP_POS = [
    { left:'-5px', width:'calc(20% + 5px)' },
    { left:'20%',  width:'20%' },
    { left:'40%',  width:'20%' },
    { left:'60%',  width:'20%' },
    { left:'80%',  width:'calc(20% + 5px)' }
  ];

  var CONTROLS = {};
  function makeControl(key, label, fwdDur, revDur, revHoldGuard){
    CONTROLS[key] = {
      key: key,
      label: label,
      fwdEl: document.getElementById('v-' + key + '-fwd'),
      revEl: document.getElementById('v-' + key + '-rev'),
      btn: null,
      fwdDur: fwdDur,
      revDur: revDur,
      revHoldGuard: revHoldGuard || 0.08,
      fwdReady: false,
      revReady: false
    };
  }
  makeControl('scene', 'Scene', 2.08, 2.08, 0.18);
  makeControl('light', 'Lighting', 2.08, 2.04, 0.08);
  makeControl('colorway', 'Clothing', 2.08, 2.08, 0.08);
  makeControl('fullLook', 'Cast', 3.00, 2.48, 0.08);

  optionButtons.forEach(function(btn){
    var key = btn.getAttribute('data-key');
    CONTROLS[key].btn = btn;
  });

  var state = { scene:'base', playback:'loading' };
  var locked = false;
  var transitionToken = 0;
  var visibleEl = CONTROLS.colorway.fwdEl;

  function announce(text){
    liveRegion.textContent = '';
    window.setTimeout(function(){ liveRegion.textContent = text; }, 30);
  }

  function showVideo(el){
    for (var i=0;i<allMedia.length;i++){
      if (allMedia[i] === el) { allMedia[i].classList.add('is-visible'); }
      else { allMedia[i].classList.remove('is-visible'); }
    }
    visibleEl = el;
  }

  /* ---------- readiness ---------- */
  function markReady(key, dir){
    CONTROLS[key][dir === 'forward' ? 'fwdReady' : 'revReady'] = true;
    var c = CONTROLS[key];
    if (c.fwdReady && c.revReady && c.btn.disabled && state.scene === 'base'){
      c.btn.disabled = false;
    }
  }
  function watchReady(el, key, dir){
    function onReady(){ markReady(key, dir); }
    if (el.readyState >= 2){ onReady(); }
    el.addEventListener('loadeddata', onReady);
  }
  Object.keys(CONTROLS).forEach(function(key){
    watchReady(CONTROLS[key].fwdEl, key, 'forward');
    watchReady(CONTROLS[key].revEl, key, 'reverse');
  });

  function initBase(){
    var el = CONTROLS.colorway.fwdEl;
    function ready(){
      try { el.currentTime = 0; } catch(e){}
      el.pause();
      showVideo(el);
      state.playback = 'ready';
      announce('MODA fitting room ready.');
    }
    if (el.readyState >= 2){ ready(); }
    else { el.addEventListener('loadeddata', ready, { once:true }); }
  }
  initBase();

  /* ---------- hover / focus capsule ---------- */
  function setCapsule(index){
    var pos = CAP_POS[index];
    controller.style.setProperty('--cap-left', pos.left);
    controller.style.setProperty('--cap-width', pos.width);
  }
  setCapsule(0);

  var focusedIndex = -1;

  function indexOfBtn(btn){
    for (var i=0;i<optionButtons.length;i++){
      if (optionButtons[i] === btn) return i+1;
    }
    return 0;
  }

  optionButtons.forEach(function(btn){
    btn.addEventListener('mouseenter', function(){
      if (controller.classList.contains('collapsed')) return;
      controller.classList.add('hover-active');
      setCapsule(indexOfBtn(btn));
    });
    btn.addEventListener('mouseleave', function(){
      if (controller.classList.contains('collapsed')) return;
      if (focusedIndex === -1){
        controller.classList.remove('hover-active');
        setCapsule(0);
      }
    });
    btn.addEventListener('focus', function(){
      if (controller.classList.contains('collapsed')) return;
      focusedIndex = indexOfBtn(btn);
      controller.classList.add('hover-active');
      setCapsule(focusedIndex);
    });
    btn.addEventListener('blur', function(){
      focusedIndex = -1;
      if (controller.classList.contains('collapsed')) return;
      controller.classList.remove('hover-active');
      setCapsule(0);
    });
  });

  controller.addEventListener('mousemove', function(e){
    var rect = controller.getBoundingClientRect();
    if (rect.width === 0 || rect.height === 0) return;
    var x = ((e.clientX - rect.left) / rect.width * 100).toFixed(2) + '%';
    var y = ((e.clientY - rect.top) / rect.height * 100).toFixed(2) + '%';
    controller.style.setProperty('--glass-x', x);
    controller.style.setProperty('--glass-y', y);
  });

  /* ---------- seam-safe player ---------- */
  function seekTo(el, t){
    return new Promise(function(resolve){
      if (Math.abs(el.currentTime - t) < 0.001){ resolve(); return; }
      function onSeeked(){ el.removeEventListener('seeked', onSeeked); resolve(); }
      el.addEventListener('seeked', onSeeked);
      try { el.currentTime = t; } catch(e){ el.removeEventListener('seeked', onSeeked); resolve(); }
    });
  }

  function waitFirstFrame(el, token){
    return new Promise(function(resolve, reject){
      var settled = false;
      var timeoutId = null;
      var remaining = 12000;
      var tStart = 0;
      var frameCbId = null;
      var rafId = null;

      function clearAll(){
        if (timeoutId){ window.clearTimeout(timeoutId); timeoutId = null; }
        document.removeEventListener('visibilitychange', onVis);
        if (frameCbId !== null && el.cancelVideoFrameCallback){ el.cancelVideoFrameCallback(frameCbId); }
        if (rafId !== null){ window.cancelAnimationFrame(rafId); }
      }
      function succeed(){
        if (settled || token !== transitionToken) return;
        settled = true; clearAll(); resolve();
      }
      function failNow(err){
        if (settled) return;
        settled = true; clearAll(); reject(err);
      }
      function startTimer(){
        tStart = Date.now();
        timeoutId = window.setTimeout(function(){ failNow(new Error('frame-timeout')); }, remaining);
      }
      function pauseTimer(){
        if (timeoutId){
          window.clearTimeout(timeoutId); timeoutId = null;
          remaining -= (Date.now() - tStart);
          if (remaining < 0) remaining = 0;
        }
      }
      function onVis(){
        if (document.hidden){
          pauseTimer();
          try { el.pause(); } catch(e){}
        } else {
          if (!settled){ startTimer(); attemptPlay(); }
        }
      }
      document.addEventListener('visibilitychange', onVis);

      function onFrame(now, meta){
        if (token !== transitionToken || settled) return;
        if (meta && typeof meta.mediaTime === 'number'){
          if (meta.mediaTime <= 0.5 && el.readyState >= 2){ succeed(); return; }
        } else if (el.readyState >= 2){
          succeed(); return;
        }
        frameCbId = el.requestVideoFrameCallback(onFrame);
      }

      function fallbackReady(){
        function check(){
          if (token !== transitionToken || settled) return;
          if (el.readyState >= 2 && !el.paused){
            rafId = window.requestAnimationFrame(function(){
              rafId = window.requestAnimationFrame(function(){ succeed(); });
            });
          } else {
            rafId = window.requestAnimationFrame(check);
          }
        }
        check();
      }

      function attemptPlay(){
        var playPromise;
        try { playPromise = el.play(); } catch(e){ failNow(e); return; }
        if (el.requestVideoFrameCallback){
          frameCbId = el.requestVideoFrameCallback(onFrame);
        } else {
          fallbackReady();
        }
        if (playPromise && typeof playPromise.then === 'function'){
          playPromise.catch(function(err){ failNow(err); });
        }
      }

      startTimer();
      attemptPlay();
    });
  }

  function monitorHold(el, duration, guard, token){
    return new Promise(function(resolve){
      var doneFlag = false;
      var rafId = null;
      function onEnded(){ finish(); }
      function finish(){
        if (doneFlag) return;
        doneFlag = true;
        el.removeEventListener('ended', onEnded);
        if (rafId !== null){ window.cancelAnimationFrame(rafId); }
        resolve();
      }
      el.addEventListener('ended', onEnded);
      function tick(){
        if (token !== transitionToken) return;
        if (el.currentTime >= (duration - guard)){ finish(); return; }
        rafId = window.requestAnimationFrame(tick);
      }
      rafId = window.requestAnimationFrame(tick);
    });
  }

  function runTransition(control, direction){
    var myToken = ++transitionToken;
    var el = direction === 'forward' ? control.fwdEl : control.revEl;
    var duration = direction === 'forward' ? control.fwdDur : control.revDur;
    var guard = direction === 'forward' ? 0.08 : control.revHoldGuard;

    return seekTo(el, 0).then(function(){
      if (myToken !== transitionToken) return Promise.reject(new Error('stale'));
      return waitFirstFrame(el, myToken);
    }).then(function(){
      if (myToken !== transitionToken) return Promise.reject(new Error('stale'));
      showVideo(el);
      return monitorHold(el, duration, guard, myToken);
    }).then(function(){
      if (myToken !== transitionToken) return Promise.reject(new Error('stale'));
      el.pause();
    });
  }

  /* ---------- UI choreography ---------- */
  function lockAllButtons(){
    optionButtons.forEach(function(b){ b.disabled = true; });
  }

  function beginForwardUI(control){
    controller.classList.remove('hover-active');
    controller.classList.add('collapsed');
    setCapsule(0); /* placeholder, overridden by collapsed rule via custom props below */
    controller.style.setProperty('--cap-left', 'calc(50% - 100px)');
    controller.style.setProperty('--cap-width', '200px');

    var chosenRect = control.btn.getBoundingClientRect();
    allCells.forEach(function(cell){
      if (cell !== control.btn){ cell.classList.add('dim'); }
    });

    var capsuleTargetCenterX = window.innerWidth / 2;
    var capsuleTargetCenterY = controller.getBoundingClientRect().top + 36;
    var chosenCenterX = chosenRect.left + chosenRect.width/2;
    var chosenCenterY = chosenRect.top + chosenRect.height/2;
    var dx = capsuleTargetCenterX - chosenCenterX;
    var dy = capsuleTargetCenterY - chosenCenterY;
    control.btn.style.transform = 'translate(' + dx.toFixed(1) + 'px,' + dy.toFixed(1) + 'px)';

    var delayMs = Math.min(control.fwdDur * 0.12, 0.9) * 1000;
    control.titleTimer = window.setTimeout(function(){
      stage.classList.add('title-hidden');
    }, delayMs);

    announce(control.label + ' switching.');
  }

  function finalizeForwardUI(control){
    control.btn.disabled = false;
    control.btn.classList.remove('dim');
    control.btn.style.transform = '';
    control.btn.textContent = 'Reset';
    control.btn.classList.add('is-reset');
    control.btn.setAttribute('aria-hidden', 'false');

    optionButtons.forEach(function(b){
      if (b !== control.btn){
        b.disabled = true;
        b.setAttribute('aria-hidden', 'true');
        b.setAttribute('tabindex', '-1');
      }
    });
    selectLabel.setAttribute('aria-hidden', 'true');

    announce(control.label + ' selected. Press Reset to go back.');
  }

  function beginReverseUI(control){
    control.btn.classList.remove('is-reset');
    control.btn.classList.add('reset-exit');

    controller.classList.remove('collapsed');
    setCapsule(0);
    controller.style.setProperty('--cap-left', CAP_POS[0].left);
    controller.style.setProperty('--cap-width', CAP_POS[0].width);

    window.setTimeout(function(){
      allCells.forEach(function(cell){
        if (cell !== control.btn){
          cell.style.transition = 'opacity 760ms var(--retake-ease), filter 760ms var(--retake-ease), transform 760ms var(--retake-slow-ease)';
          cell.classList.remove('dim');
        }
      });
    }, 60);

    announce('Restoring default look.');
  }

  function finalizeReverseUI(control){
    control.btn.classList.remove('reset-exit');
    control.btn.textContent = control.label;
    control.btn.style.transform = '';

    optionButtons.forEach(function(b){
      b.style.transition = '';
      b.removeAttribute('aria-hidden');
      b.removeAttribute('tabindex');
      b.disabled = false;
    });
    selectLabel.removeAttribute('aria-hidden');

    stage.classList.remove('title-hidden');
    announce('Back to the default look.');
  }

  function revertToSafeState(){
    /* on failure: never claim completion, never leave the UI stuck */
    optionButtons.forEach(function(b){
      b.style.transform = '';
      b.style.transition = '';
      b.classList.remove('dim', 'reset-exit');
    });
    if (state.scene === 'base'){
      controller.classList.remove('collapsed');
      setCapsule(0);
      controller.style.setProperty('--cap-left', CAP_POS[0].left);
      controller.style.setProperty('--cap-width', CAP_POS[0].width);
      optionButtons.forEach(function(b){
        b.classList.remove('is-reset');
        b.textContent = CONTROLS[b.getAttribute('data-key')].label;
        b.disabled = false;
        b.removeAttribute('aria-hidden');
        b.removeAttribute('tabindex');
      });
      selectLabel.removeAttribute('aria-hidden');
      stage.classList.remove('title-hidden');
    } else {
      var c = CONTROLS[state.scene];
      controller.classList.add('collapsed');
      controller.style.setProperty('--cap-left', 'calc(50% - 100px)');
      controller.style.setProperty('--cap-width', '200px');
      optionButtons.forEach(function(b){
        if (b === c.btn){
          b.textContent = 'Reset';
          b.classList.add('is-reset');
          b.disabled = false;
          b.removeAttribute('aria-hidden');
          b.removeAttribute('tabindex');
        } else {
          b.disabled = true;
          b.setAttribute('aria-hidden', 'true');
          b.setAttribute('tabindex', '-1');
        }
      });
      selectLabel.setAttribute('aria-hidden', 'true');
      stage.classList.add('title-hidden');
    }
  }

  function showNotice(message, retryFn){
    noticeText.textContent = message;
    notice.hidden = false;
    if (retryFn){
      retryBtn.hidden = false;
      retryBtn.onclick = function(){
        notice.hidden = true;
        retryBtn.hidden = true;
        retryFn();
      };
    } else {
      retryBtn.hidden = true;
    }
  }
  function hideNotice(){ notice.hidden = true; retryBtn.hidden = true; }

  function onOptionClick(control){
    if (locked || state.scene !== 'base' || state.playback !== 'ready') return;
    locked = true;
    lockAllButtons();
    var hadFocus = (document.activeElement === control.btn);
    beginForwardUI(control);

    runTransition(control, 'forward').then(function(){
      state.scene = control.key;
      finalizeForwardUI(control);
      locked = false;
      if (hadFocus){
        window.requestAnimationFrame(function(){ control.btn.focus({ preventScroll:true }); });
      }
    }).catch(function(){
      window.clearTimeout(control.titleTimer);
      revertToSafeState();
      locked = false;
      showNotice("Couldn't update " + control.label + ".", function(){ onOptionClick(control); });
      announce("Couldn't update " + control.label + '. Press Retry.');
    });
  }

  function onResetClick(control){
    if (locked || state.scene !== control.key) return;
    locked = true;
    lockAllButtons();
    var hadFocus = (document.activeElement === control.btn);
    beginReverseUI(control);

    runTransition(control, 'reverse').then(function(){
      state.scene = 'base';
      finalizeReverseUI(control);
      locked = false;
      if (hadFocus){
        window.requestAnimationFrame(function(){ control.btn.focus({ preventScroll:true }); });
      }
    }).catch(function(){
      revertToSafeState();
      locked = false;
      showNotice('Something went wrong.', function(){ onResetClick(control); });
      announce('Something went wrong. Press Retry.');
    });
  }

  optionButtons.forEach(function(btn){
    var key = btn.getAttribute('data-key');
    btn.addEventListener('click', function(){
      var control = CONTROLS[key];
      if (state.scene === 'base'){ onOptionClick(control); }
      else if (state.scene === key){ onResetClick(control); }
    });
  });

  hideNotice();
})();
</script>
</body>
</html>
